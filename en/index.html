<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>AI Engineer Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: chapter rail (left) · reading column (~66ch) · section index (right, wide screens only) */
:root{
  --bg:#F6F3EC; --surface:#FFFDF8; --surface-2:#EDE8DC; --line:#E4DFD3;
  --fg:#14161F; --muted:#4A4F5C; --faint:#6B7183;
  --accent:#FF6A2B; --accent-ink:#C2410C; --on-accent:#14161F;
  --code-bg:#14161F; --code-fg:#F6F3EC; --code-dim:#9AA0AE;
  --good:#1E7A4B; --good-bg:#E3F2E9; --bad:#B42318; --bad-bg:#FBE7E4;
  --font:'Bricolage Grotesque', 'Segoe UI', Arial, sans-serif;
  --mono:'JetBrains Mono', 'Courier New', monospace;
  --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161F; --surface:#1E2230; --surface-2:#191C27; --line:#2C3142;
  --fg:#F6F3EC; --muted:#C9CCD6; --faint:#9AA0AE;
  --accent:#FF6A2B; --accent-ink:#FF8A55; --on-accent:#14161F;
  --code-bg:#0E1016; --code-fg:#F6F3EC; --code-dim:#9AA0AE;
  --good:#5BD49A; --good-bg:#16352A; --bad:#FF8A7A; --bad-bg:#3A1F1F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14161F; --surface:#1E2230; --surface-2:#191C27; --line:#2C3142;
  --fg:#F6F3EC; --muted:#C9CCD6; --faint:#9AA0AE;
  --accent:#FF6A2B; --accent-ink:#FF8A55; --on-accent:#14161F;
  --code-bg:#0E1016; --code-fg:#F6F3EC; --code-dim:#9AA0AE;
  --good:#5BD49A; --good-bg:#16352A; --bad:#FF8A7A; --bad-bg:#3A1F1F;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:500;font-size:17px;line-height:1.6;letter-spacing:.005em;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
a{color:var(--accent-ink);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-weight:800;line-height:1.15;letter-spacing:.01em;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}

.app{display:grid;grid-template-columns:270px minmax(0,1fr) 220px;gap:48px;max-width:1360px;margin:0 auto;padding-block:32px 96px}
@media (max-width:1180px){.app{grid-template-columns:250px minmax(0,1fr)}.toc{display:none}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:16px 72px}}

/* Rail */
.rail{position:sticky;top:calc(24px + env(safe-area-inset-top, 0px));align-self:start;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 48px);overflow:auto;padding-right:4px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand-name{font-size:24px;font-weight:800;letter-spacing:.02em}
.brand-sub{font-size:14px;color:var(--faint)}
.progress{display:flex;flex-direction:column;gap:8px}
.progress-bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress-bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.progress-text{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chapters button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 18px;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:9px 10px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px;line-height:1.3}
.chapters button:hover{background:var(--surface-2)}
.chapters button[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.chapters .num{font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.chapters .soon{color:var(--faint)}
.chapters .mark{font-size:13px;font-weight:800;color:var(--good);text-align:right}
.navtoggle{display:none}
@media (max-width:860px){
  .rail{position:static;max-height:none;overflow:visible}
  .navtoggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer}
  .rail[data-collapsed="true"] .chapters{display:none}
}

/* Reading column */
main{min-width:0}
.chapter-head{display:flex;flex-direction:column;gap:16px;padding-bottom:28px;border-bottom:2px solid var(--line);margin-bottom:8px}
.chapter-head h1{font-size:clamp(34px,5vw,54px)}
.chapter-head .lead{font-size:20px;color:var(--muted);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.goals{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.goals h2{font-size:18px}
.goals ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

section.block{padding-top:44px;display:flex;flex-direction:column;gap:18px;max-width:70ch;scroll-margin-top:24px}
section.block > h2{font-size:clamp(25px,3vw,32px)}
section.block > h2 .sn{color:var(--accent-ink);margin-right:10px;font-variant-numeric:tabular-nums}
.prose p, section.block > p{font-size:17.5px}
section.block ul, section.block ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
b,strong{font-weight:800}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}

.note{border-radius:var(--radius);padding:16px 20px;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line)}
.note .note-title{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.note.key{border-color:var(--accent)}
.note.key .note-title{color:var(--accent-ink)}
.note.warn{background:var(--surface-2)}
.note.warn .note-title{color:var(--bad)}

.wide{max-width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:520px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:800;border-bottom:2px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.caption{font-size:13.5px;color:var(--faint)}

.chips{background:var(--code-bg);color:var(--code-fg);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px}
.chips .label{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--code-dim)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:16px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:pre}
.chip:nth-child(odd){background:var(--accent);color:var(--on-accent)}
.chip:nth-child(even){background:#3A3F4E;color:#F6F3EC}
.chips .foot{font-weight:700}

.bars{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-weight:700;font-size:15px}
.bar .track{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:34px;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{font-size:14px;color:var(--muted);line-height:1.35}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.flow .step{flex:1 1 150px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.flow .step b{font-size:15px}
.flow .step span{font-size:14px;color:var(--muted);line-height:1.4}
.flow .arrow{align-self:center;color:var(--accent-ink);font-weight:800;font-size:22px}
@media (max-width:620px){.flow{flex-direction:column}.flow .arrow{transform:rotate(90deg);align-self:center}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font-size:17px}
.card p{font-size:15px;color:var(--muted);line-height:1.5}
.card .tag{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}

.term{background:var(--code-bg);color:var(--code-fg);border-radius:var(--radius);padding:18px 20px;font-family:var(--mono);font-size:14.5px;line-height:1.7;overflow-x:auto;white-space:pre}
.term .pr{color:var(--accent)}
.term .cm{color:var(--code-dim)}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure svg{width:100%;height:auto;max-width:640px}
.source{font-size:13.5px;color:var(--faint)}

.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(s);font-weight:800;color:var(--on-accent);background:var(--accent);border-radius:99px;width:28px;height:28px;display:grid;place-items:center;font-size:14px;margin-top:1px}

.mistakes{display:flex;flex-direction:column;gap:10px}
.mistake{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.mistake div{padding:12px 16px;font-size:15.5px;line-height:1.45}
.mistake .w{background:var(--surface-2)}
.mistake .r{background:var(--surface)}
.mistake .ml{display:block;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.mistake .w .ml{color:var(--bad)}
.mistake .r .ml{color:var(--good)}
@media (max-width:620px){.mistake{grid-template-columns:minmax(0,1fr)}}

.quiz{display:flex;flex-direction:column;gap:16px}
.q{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.q h3{font-size:17.5px;line-height:1.35}
.q .opts{display:flex;flex-direction:column;gap:8px}
.q .opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:15.5px;line-height:1.4}
.q .opt:hover:not([disabled]){border-color:var(--accent)}
.q .opt[disabled]{cursor:default}
.q .opt.correct{border-color:var(--good);background:var(--good-bg)}
.q .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.q .explain{font-size:15px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px}
.score{font-weight:800;font-size:15px}

.summary{display:grid;gap:10px}
.sum{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-top:2px solid var(--line)}
.sum .i{font-size:26px;font-weight:800;color:var(--accent-ink);line-height:1.1}
.sum p{font-size:17px;font-weight:600}
dl.gloss{margin:0;display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:8px 18px}
dl.gloss dt{font-weight:800}
dl.gloss dd{margin:0;color:var(--muted)}
@media (max-width:620px){dl.gloss{grid-template-columns:minmax(0,1fr)}dl.gloss dd{margin-bottom:8px}}

.endbar{margin-top:48px;max-width:70ch;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:2px solid var(--line)}
.btn[aria-pressed="true"]{background:var(--good);color:#FFFDF8}

.soonpage{display:flex;flex-direction:column;gap:18px;max-width:66ch}
.soonpage ul{margin:0;padding-left:22px}

/* Section index */
.toc{position:sticky;top:calc(24px + env(safe-area-inset-top, 0px));align-self:start;display:flex;flex-direction:column;gap:8px;font-size:14px}
.toc .eyebrow{color:var(--faint)}
.toc button{background:none;border:0;text-align:left;padding:4px 0 4px 12px;border-left:2px solid var(--line);color:var(--muted);cursor:pointer;line-height:1.35;font-weight:600}
.toc button:hover{color:var(--fg);border-left-color:var(--accent)}
.asof{font-size:13px;color:var(--faint);margin-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="rail" id="rail" data-collapsed="true">
    <div class="brand">
      <span class="eyebrow" id="ui-eyebrow"></span>
      <span class="brand-name" id="ui-brand"></span>
      <span class="brand-sub" id="ui-brandsub"></span>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-bar"><span id="prog-fill"></span></div>
      <span class="progress-text" id="prog-text"></span>
    </div>
    <button class="navtoggle" id="navtoggle" aria-expanded="false" aria-controls="chapters"><span id="ui-chapters"></span><span aria-hidden="true">▾</span></button>
    <ol class="chapters" id="chapters"></ol>
    <p class="asof" id="ui-asof"></p>
  </aside>
  <main id="main" tabindex="-1"></main>
  <nav class="toc" id="toc" aria-label="Sections"></nav>
</div>

<script>
window.BOOK = { lang: 'en', content: { uz: {}, en: {} } };
window.BOOK_UI = {

    chapters: 'Chapters', asof: 'Facts, prices and model names checked as of November 2026.',
    progress: (d, t) => `${d} / ${t} chapters read`, chapter: 'Chapter', minutes: m => `≈ ${m} min read`,
    goals: 'What you will learn', mistakes: 'Common mistakes', lab: 'Hands-on', quiz: 'Check yourself',
    summary: 'Summary', glossary: 'Glossary', sources: 'Sources', sections: 'In this chapter',
    markRead: 'Mark as read', marked: 'Read ✓', next: 'Next chapter →', prev: '← Previous chapter',
    score: (c, t) => `Score: ${c} / ${t}`, soonTitle: 'This chapter is in progress',
    soonText: 'The text is being written and checked against sources. It will cover:',
    note_key: 'Key point', note_warn: 'Caution', note_info: 'Note', measured: 'Measured',
    wrong: 'Myth', right: 'Reality', otherLang: 'O‘zbekcha versiya'
  }
};
window.BOOK_TOC = [
  { id: '01', title: 'Foundations', topics: ['How LLMs work', 'Tokens', 'Context window', 'Temperature and top-p', 'Open vs closed models'] },
  { id: '02', title: 'Models and APIs', topics: ['Providers and pricing', 'How APIs work', 'Saving money', 'Running locally: Ollama, LM Studio, Hugging Face'] },
  { id: '03', title: 'Prompt engineering', topics: ['Zero-shot and few-shot', 'Chain of thought', 'System prompts', 'Structured output'] },
  { id: '04', title: 'Context engineering', topics: ['Giving the model the right information', 'Memory', 'Compressing long context (compaction)'] },
  { id: '05', title: 'Embeddings and vector DBs', topics: ['What embeddings are', 'Semantic search', 'Pinecone, Qdrant, Chroma, FAISS, Weaviate'] },
  { id: '06', title: 'RAG', topics: ['Chunking', 'Retrieval and answer generation', 'RAG vs fine-tuning'] },
  { id: '07', title: 'Agents', topics: ['Function calling', 'ReAct', 'MCP: servers and clients', 'Multi-agent', 'Claude Agent SDK, OpenAI Agents SDK, Google ADK, LangChain, LlamaIndex'] },
  { id: '08', title: 'Multimodal', topics: ['Image understanding and generation', 'Video', 'Speech-to-text and text-to-speech'] },
  { id: '09', title: 'Evaluation (evals)', topics: ['Measuring models', 'Human evaluation', 'Regression tests', 'Ragas, DeepEval'] },
  { id: '10', title: 'Production', topics: ['Monitoring', 'Tracking cost and latency', 'Langfuse, LangSmith, Helicone'] },
  { id: '11', title: 'Security', topics: ['Prompt injection', 'Bias', 'Content moderation', 'Privacy'] },
  { id: '12', title: 'Coding with AI', topics: ['Claude Code', 'Cursor', 'Codex', 'Windsurf (now Devin Desktop)'] }
];
</script>

<script>
(function () {
  const B = window.BOOK, T = window.BOOK_TOC, L = () => window.BOOK_UI[B.lang];
  const KEY = 'aieng-book-v1';
  let state = { read: {}, quiz: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') state = Object.assign(state, s); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const content = id => (B.content[B.lang] || {})[id];
  // Stable shuffle of answer options per question (same order on every visit)
  function order(seed, n) {
    let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
    const a = [...Array(n).keys()];
    for (let i = n - 1; i > 0; i--) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function renderBlock(b) {
    switch (b.type) {
      case 'p': return `<p>${b.html}</p>`;
      case 'list': return b.ordered ? `<ol>${b.items.map(i => `<li>${i}</li>`).join('')}</ol>` : `<ul>${b.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
      case 'note': return `<div class="note ${b.tone || 'info'}"><span class="note-title">${esc(b.title || L()['note_' + (b.tone || 'info')])}</span><p>${b.html}</p></div>`;
      case 'table': return `<div class="wide"><table><thead><tr>${b.head.map((h, i) => `<th${(b.num || []).includes(i) ? ' class="n"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((c, i) => `<td${(b.num || []).includes(i) ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${b.caption ? `<p class="caption">${b.caption}</p>` : ''}`;
      case 'tokens': return `<div class="chips"><span class="label">${b.label}</span><div class="chip-row">${b.items.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>${b.foot ? `<span class="foot">${b.foot}</span>` : ''}</div>`;
      case 'bars': { const max = b.max || Math.max(...b.items.map(i => i.value)); return `<div class="bars">${b.title ? `<span class="eyebrow">${b.title}</span>` : ''}${b.items.map(i => `<div class="bar"><span>${i.label}</span><span class="track"><span class="fill" style="width:${Math.max(1.5, i.value / max * 100)}%"></span></span><span class="v">${i.text || i.value}</span></div>`).join('')}${b.caption ? `<span class="caption">${b.caption}</span>` : ''}</div>`; }
      case 'stats': return `<div class="stats">${b.items.map(s => `<div class="stat"><span class="v">${s.value}</span><span class="l">${s.label}</span></div>`).join('')}</div>${b.caption ? `<p class="caption">${b.caption}</p>` : ''}`;
      case 'flow': return `<div class="flow">${b.items.map((s, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<div class="step"><b>${s.title}</b>${s.text ? `<span>${s.text}</span>` : ''}</div>`).join('')}</div>`;
      case 'cards': return `<div class="cards">${b.items.map(c => `<div class="card">${c.tag ? `<span class="tag">${c.tag}</span>` : ''}<h3>${c.title}</h3><p>${c.html}</p></div>`).join('')}</div>`;
      case 'term': return `<div class="term" role="region" aria-label="Terminal">${b.lines.map(l => { if (l.startsWith('#')) return `<span class="cm">${esc(l)}</span>`; const m = /^(\$|>>>)( ?)(.*)$/.exec(l); return m ? `<span class="pr">${esc(m[1])}</span>${m[2]}${esc(m[3])}` : esc(l); }).join('\n')}</div>`;
      case 'steps': return `<ol class="steps">${b.items.map(i => `<li><span>${i}</span></li>`).join('')}</ol>`;
      case 'figure': return `<figure>${b.svg}${b.caption ? `<figcaption class="caption">${b.caption}</figcaption>` : ''}</figure>`;
      case 'source': return `<p class="source">${b.html}</p>`;
      default: return '';
    }
  }

  function renderNav() {
    const done = T.filter(c => state.read[c.id]).length;
    $('prog-fill').style.width = (done / T.length * 100) + '%';
    $('prog-text').textContent = L().progress(done, T.length);
    const cur = currentId();
    $('chapters').innerHTML = T.map(c => `<li><button data-id="${c.id}"${c.id === cur ? ' aria-current="page"' : ''}><span class="num">${c.id}</span><span class="${content(c.id) ? '' : 'soon'}">${esc(c.title)}</span><span class="mark">${state.read[c.id] ? '✓' : ''}</span></button></li>`).join('');
  }

  function currentId() {
    const m = /^#bob-(\d\d)$/.exec(location.hash || '');
    return m && T.some(c => c.id === m[1]) ? m[1] : '01';
  }

  function renderChapter(id) {
    const meta = T.find(c => c.id === id), ch = content(id), U = L(), main = $('main'), toc = $('toc');
    const idx = T.findIndex(c => c.id === id), prev = T[idx - 1], next = T[idx + 1];
    const navBtns = `${prev ? `<button class="btn ghost" data-go="${prev.id}">${U.prev}</button>` : '<span></span>'}${next ? `<button class="btn ghost" data-go="${next.id}">${U.next}</button>` : ''}`;
    if (!ch) {
      main.innerHTML = `<header class="chapter-head"><span class="eyebrow">${U.chapter} ${id}</span><h1>${esc(meta.title)}</h1></header><div class="soonpage"><h2>${U.soonTitle}</h2><p>${U.soonText}</p><ul>${meta.topics.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div><div class="endbar">${navBtns}</div>`;
      toc.innerHTML = '';
      return;
    }
    const secs = [...ch.sections];
    const extra = [];
    if (ch.mistakes) extra.push({ id: 'xatolar', title: U.mistakes, html: `<div class="mistakes">${ch.mistakes.map(m => `<div class="mistake"><div class="w"><span class="ml">${U.wrong}</span>${m[0]}</div><div class="r"><span class="ml">${U.right}</span>${m[1]}</div></div>`).join('')}</div>` });
    if (ch.lab) extra.push({ id: 'amaliyot', title: U.lab, html: ch.lab.map(renderBlock).join('') });
    if (ch.quiz) extra.push({ id: 'test', title: U.quiz, html: `<div class="quiz" data-ch="${id}">${ch.quiz.map((q, qi) => `<div class="q" data-q="${qi}"><h3>${qi + 1}. ${q.q}</h3><div class="opts">${order(id + '-' + qi, q.options.length).map(oi => `<button class="opt" data-o="${oi}">${q.options[oi]}</button>`).join('')}</div><p class="explain" hidden>${q.explain}</p></div>`).join('')}<p class="score" id="score" aria-live="polite"></p></div>` });
    if (ch.summary) extra.push({ id: 'xulosa', title: U.summary, html: `<div class="summary">${ch.summary.map((s, i) => `<div class="sum"><span class="i">${i + 1}</span><p>${s}</p></div>`).join('')}</div>` });
    if (ch.glossary) extra.push({ id: 'lugat', title: U.glossary, html: `<dl class="gloss">${ch.glossary.map(g => `<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl>` });
    if (ch.sources) extra.push({ id: 'manbalar', title: U.sources, html: `<ul>${ch.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${s.label}</a></li>`).join('')}</ul>` });
    const all = secs.map((s, i) => ({ id: s.id, title: s.title, n: `${id.replace(/^0/, '')}.${i + 1}`, html: s.blocks.map(renderBlock).join('') })).concat(extra);
    main.innerHTML = `<header class="chapter-head"><span class="eyebrow">${U.chapter} ${id}</span><h1>${esc(meta.title)}</h1><p class="lead">${ch.lead}</p><div class="meta"><span class="pill">${U.minutes(ch.minutes)}</span>${(ch.tags || []).map(t => `<span class="pill">${t}</span>`).join('')}</div>${ch.goals ? `<div class="goals"><h2>${U.goals}</h2><ul>${ch.goals.map(g => `<li>${g}</li>`).join('')}</ul></div>` : ''}</header>` +
      all.map(s => `<section class="block" id="s-${s.id}"><h2>${s.n ? `<span class="sn">${s.n}</span>` : ''}${s.title}</h2>${s.html}</section>`).join('') +
      `<div class="endbar"><button class="btn" id="markread" aria-pressed="${state.read[id] ? 'true' : 'false'}">${state.read[id] ? U.marked : U.markRead}</button><span style="display:flex;gap:10px;flex-wrap:wrap">${navBtns}</span></div>`;
    toc.innerHTML = `<span class="eyebrow">${U.sections}</span>` + all.map(s => `<button data-sec="s-${s.id}">${s.title}</button>`).join('');
    restoreQuiz(id);
  }

  function restoreQuiz(id) {
    const saved = (state.quiz[id] || {}).answers || {};
    Object.keys(saved).forEach(qi => answer(id, +qi, saved[qi], true));
    updateScore(id);
  }
  function answer(id, qi, oi, silent) {
    const q = content(id).quiz[qi], box = document.querySelector(`.q[data-q="${qi}"]`);
    if (!box) return;
    box.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (i === q.answer) b.classList.add('correct'); else if (i === oi) b.classList.add('wrong'); });
    box.querySelector('.explain').hidden = false;
    if (!silent) { state.quiz[id] = state.quiz[id] || { answers: {} }; state.quiz[id].answers[qi] = oi; save(); updateScore(id); }
  }
  function updateScore(id) {
    const ans = (state.quiz[id] || {}).answers || {}, qs = content(id).quiz, el = $('score');
    const n = Object.keys(ans).length; if (!el) return;
    el.textContent = n ? L().score(Object.keys(ans).filter(k => ans[k] === qs[k].answer).length, qs.length) : '';
  }

  function go(id) { if (location.hash !== '#bob-' + id) location.hash = 'bob-' + id; else route(); }
  function route() { const id = currentId(); renderNav(); renderChapter(id); window.scrollTo(0, 0); $('rail').dataset.collapsed = 'true'; $('navtoggle').setAttribute('aria-expanded', 'false'); }

  document.addEventListener('click', e => {
    const c = e.target.closest('[data-id]'); if (c && c.closest('#chapters')) { go(c.dataset.id); return; }
    const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
    const s = e.target.closest('[data-sec]'); if (s) { const el = document.getElementById(s.dataset.sec); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const o = e.target.closest('.opt'); if (o && !o.disabled) { const q = o.closest('.q'), quiz = o.closest('.quiz'); answer(quiz.dataset.ch, +q.dataset.q, +o.dataset.o); return; }
    if (e.target.closest('#markread')) { const id = currentId(); state.read[id] = !state.read[id]; save(); renderNav(); const b = $('markread'); b.setAttribute('aria-pressed', state.read[id] ? 'true' : 'false'); b.textContent = state.read[id] ? L().marked : L().markRead; return; }
    if (e.target.closest('#navtoggle')) { const r = $('rail'), open = r.dataset.collapsed === 'true'; r.dataset.collapsed = open ? 'false' : 'true'; $('navtoggle').setAttribute('aria-expanded', String(open)); }
  });
  window.addEventListener('hashchange', route);

  const U = L();
  $('ui-eyebrow').textContent = U.eyebrow; $('ui-brand').textContent = U.brand; $('ui-brandsub').textContent = U.brandsub;
  $('ui-chapters').textContent = U.chapters; $('ui-asof').textContent = U.asof; if ($('ui-other')) $('ui-other').textContent = U.otherLang;
  document.documentElement.lang = B.lang;
  route();
})();
</script>
</body>
</html>
